      - 'computer_agent.py'
      - 'android_mcp_bridge.py'
      - 'android_mcp_actions.py'
      - 'tests/test_android_mcp_actions.py'
      - 'tests/test_android_mcp_approval.py'
      - 'agent_runtime_pilot.py'
      - 'tests/test_android_mcp_bridge.py'
      - 'repo_agent_bindings.py'
      - 'repo_agent_repair.py'
      - 'repo_agent_ai_patch.py'
      - 'repo_agent_pr_ci.py'
      - 'repo_agent_pr_triage.py'
      - 'repo_agent_pr_revision.py'
      - 'repo_agent_pr_annotations.py'
