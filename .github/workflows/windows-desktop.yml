name: Windows Electron Robot Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'windows_native.py'
      - 'computer_executor.py'
      - 'computer_agent.py'
      - 'repo_agent_bindings.py'
      - 'repo_agent_repair.py'
      - 'repo_agent_ai_patch.py'
      - 'repo_agent_pr_ci.py'
      - 'repo_agent_pr_triage.py'
      - 'repo_agent_pr_revision.py'
      - 'tests/test_repo_agent_pr_revision.py'
      - 'tests/test_repo_agent_pr_triage.py'
      - 'tests/test_repo_agent_pr_ci.py'
      - 'tests/test_repo_agent_ai_patch.py'
      - 'tests/test_repo_agent_repair.py'
      - 'agent_work_orders.py'
      - 'static/agent_work.html'
      - 'tests/test_agent_fleet.py'
      - 'static/repo_agents.html'
      - 'tests/test_repo_agent_bindings.py'
      - 'robot_vision.py'
      - 'robot_sandbox.py'
      - 'worker.py'
      - 'openrouter_provider.py'
      - 'openrouter_free_catalog.py'
      - 'openrouter_user_allowlist.py'
      - 'scripts/windows_packaged_e2e.py'
      - 'scripts/windows_electron_gui_e2e.py'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'windows_native.py'
      - 'computer_executor.py'
      - 'computer_agent.py'
      - 'repo_agent_bindings.py'
      - 'repo_agent_repair.py'
      - 'repo_agent_ai_patch.py'
      - 'repo_agent_pr_ci.py'
      - 'repo_agent_pr_triage.py'
      - 'repo_agent_pr_revision.py'
      - 'tests/test_repo_agent_pr_revision.py'
      - 'tests/test_repo_agent_pr_triage.py'
      - 'tests/test_repo_agent_pr_ci.py'
      - 'tests/test_repo_agent_ai_patch.py'
      - 'tests/test_repo_agent_repair.py'
      - 'agent_work_orders.py'
      - 'static/agent_work.html'
      - 'tests/test_agent_fleet.py'
      - 'static/repo_agents.html'
      - 'tests/test_repo_agent_bindings.py'
      - 'openrouter_provider.py'
      - 'openrouter_free_catalog.py'
      - 'openrouter_user_allowlist.py'
      - 'scripts/windows_packaged_e2e.py'
      - 'scripts/windows_electron_gui_e2e.py'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-electron:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Windows native and frozen runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7" "pillow>=11,<13" "psutil>=6,<9" "pywinauto>=0.6.9,<1" "playwright==1.58.0"

      - name: Install SHA256-verified Agent-Reach from original GitHub release
        run: python scripts/install_agent_reach_windows.py

      - name: Test Win32 controller safety defaults (without OS clicks)
        env:
          LHM_DB_PATH: lhm-ci-native-unit.sqlite3
        run: python -m unittest discover -s tests -p "test_*native.py" -v

      - name: Run Python runtime import test
        env:
          LHM_DB_PATH: lhm-ci-native-runtime.sqlite3
        run: python desktop/runtime.py self-test

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bundle OpenCLI 2.0.2 and Node 24 directly for Windows customers
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "desktop/vendor/opencli-runtime"
          New-Item -ItemType Directory -Force $bundle | Out-Null
          npm install --prefix $bundle --no-save --ignore-scripts --no-audit --no-fund @jackwener/opencli@2.0.2
          if ($LASTEXITCODE -ne 0) { throw "Pinned OpenCLI package install failed" }
          Copy-Item -LiteralPath (Get-Command node).Source -Destination (Join-Path $bundle "node.exe")
          $cli = Join-Path $bundle "node_modules/@jackwener/opencli/dist/src/main.js"
          $package = Join-Path $bundle "node_modules/@jackwener/opencli/package.json"
          if (-not (Test-Path $cli) -or -not (Test-Path $package) -or -not (Test-Path (Join-Path $bundle "node.exe"))) {
            throw "Bundled Node/OpenCLI entrypoint missing"
          }
          $meta=Get-Content $package -Raw | ConvertFrom-Json
          if ($meta.name -ne "@jackwener/opencli" -or $meta.version -ne "2.0.2") { throw "Unexpected OpenCLI version" }
          $help = (& (Join-Path $bundle "node.exe") $cli browser state --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "--profile" -or $help -notmatch "--session") {
            throw "OpenCLI v2.0.2 subcommand profile/session flags missing"
          }
          & (Join-Path $bundle "node.exe") $cli browser state --profile ci-test-only --session lhm-ci-test --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "OpenCLI browser leaf-level options incompatible" }
          Write-Host "Node + pinned OpenCLI leaf-level CLI contract validated; no live Chrome profile used"

      - name: Validate Electron JavaScript before packaging
        run: |
          node --check desktop/scripts/ensure-opencli-bundle.cjs
          node --check desktop/main.cjs
          node --check desktop/settings-preload.cjs
          node --check desktop/settings.js
          node --check desktop/openrouter-free-test.cjs
          node --check desktop/scripts/openrouter-free-live.cjs
          node --check desktop/test/openrouter-free.test.cjs
          node --check desktop/test/security.test.cjs
          node --test desktop/test/security.test.cjs

      - name: Freeze local FastAPI, Worker and Windows Native Runner
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --console --name lhm-runtime --distpath dist --workpath build/pyinstaller --add-data "static;static" --add-data "templates;templates" --add-data "dashboard.html;." --collect-all playwright --collect-submodules uvicorn --hidden-import windows_native --hidden-import robot_vision --hidden-import robot_sandbox --hidden-import opencli_windows_bridge --hidden-import opencli_diagnostics --collect-all agent_reach --collect-all yt_dlp --hidden-import windows_public_video --collect-submodules pywinauto desktop/runtime.py

      - name: Verify Windows Agent-Reach real public GitHub search using source runtime
        shell: pwsh
        run: |
          $succeeded = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            $output = python desktop/runtime.py reach-worker github "agent tools"
            if ($LASTEXITCODE -eq 0) {
              $response = ($output | Out-String) | ConvertFrom-Json
              if ($response.ok -ne $true -or $response.channel -ne "github" -or $response.action -ne "search") { throw "Native Windows search result schema mismatch" }
              $succeeded = $true
              break
            }
            Write-Warning "Public GitHub search unavailable, attempt $attempt of 3"
            if ($attempt -lt 3) { Start-Sleep -Seconds 3 }
          }
          if (-not $succeeded) { throw "Windows Agent-Reach real public search failed 3 attempts" }
          Write-Host "Windows source Agent-Reach public search PASS"

      - name: Smoke test actual bundled runtime EXE
        shell: pwsh
        env:
          LHM_DB_PATH: lhm-ci-native-executable.sqlite3
        run: |
          & .\dist\lhm-runtime\lhm-runtime.exe self-test
          $succeeded = $false
          for ($attempt=1; $attempt -le 3; $attempt++) {
            $reachOutput = & .\dist\lhm-runtime\lhm-runtime.exe reach-worker github "agent tools"
            if ($LASTEXITCODE -eq 0) {
              $data = ($reachOutput | Out-String) | ConvertFrom-Json
              if ($data.ok -ne $true -or $data.channel -ne "github" -or $data.action -ne "search") { throw "Frozen Agent-Reach search schema invalid" }
              $succeeded = $true
              break
            }
            Write-Warning "Frozen public GitHub search unavailable, attempt $attempt of 3"
            if ($attempt -lt 3) { Start-Sleep -Seconds 3 }
          }
          if (-not $succeeded) { throw "Frozen Agent-Reach public GitHub search failed 3 attempts" }
          Write-Host "Frozen Agent-Reach public search PASS"
          if ($LASTEXITCODE -ne 0) { throw "Frozen Python runtime failed" }

      - name: Real packaged Windows runtime acceptance (HTTP and native auth)
        shell: pwsh
        timeout-minutes: 4
        run: python scripts/windows_packaged_e2e.py

      - name: Install Electron desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Repeat desktop unit tests with installed Electron
        working-directory: desktop
        run: npm test

      - name: Package Windows NSIS installer (unsigned pilot)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Inspect real packaged OpenCLI resources and execute shipped Node
        shell: pwsh
        run: |
          $root = Join-Path $PWD "desktop/dist/win-unpacked/resources/opencli-runtime"
          $node = Join-Path $root "node.exe"
          $cli = Join-Path $root "node_modules/@jackwener/opencli/dist/src/main.js"
          if (-not (Test-Path $node) -or -not (Test-Path $cli)) { throw "Installer is missing bundled OpenCLI or Node" }
          $help = (& $node $cli browser state --profile ci-test-only --session lhm-ci-test --help | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "--profile" -or $help -notmatch "--session") {
            throw "Installed OpenCLI flags not compatible with Windows bridge"
          }
          Write-Host "Real packaged Windows resources contain working Node/OpenCLI leaf-level flags"

      - name: Check Windows installer exists and is not empty
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/dist -Filter "LHM-Robot-Desktop-Setup-*.exe" | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 10000000) {
            throw "Windows Electron installer missing or suspiciously small"
          }
          Write-Host "Windows Electron installer built: $($installer.Name) ($($installer.Length) bytes)"
          Get-FileHash $installer.FullName -Algorithm SHA256

      - name: Real packaged Electron GUI acceptance (6 screens, screenshot, local backend)
        shell: pwsh
        timeout-minutes: 8
        run: python scripts/windows_electron_gui_e2e.py

      - name: Upload actual Electron GUI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Robot-Desktop-Windows-GUI-QA
          path: windows-electron-gui-smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows installer for owner QA
        uses: actions/upload-artifact@v4
        with:
          name: LHM-Robot-Desktop-Windows-x64-Installer
          path: desktop/dist/LHM-Robot-Desktop-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
