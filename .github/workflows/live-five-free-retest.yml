name: Five Agent Free Live Retest (one-shot)

on:
  push:
    branches: [fix/free-agent-reply-reliability-20261028]
    paths: ['.github/workflows/live-five-free-retest.yml']

permissions:
  contents: read

concurrency:
  group: live-five-role-free-20261028
  cancel-in-progress: false

jobs:
  five-real-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install backend requirements
        run: python -m pip install -r requirements.txt
      - name: Run real Free-only five-role smoke with strict bound
        env:
          PYTHONPATH: .
          OPENROUTER_TEST_API_KEY: ${{ secrets.OPENROUTER_TEST_API_KEY }}
          LHM_OPENROUTER_FREE_ONLY: '1'
          LHM_LLM_PROVIDER: openrouter
          OPENROUTER_MODEL: openrouter/free
          DEEPSEEK_API_KEY: ''
          LHM_ALLOW_PRO: '0'
        run: python scripts/live_five_free_agent_smoke.py
      - name: Upload summary only (no prompts or keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-free-role-summary
          path: five-free-roles-result.json
          if-no-files-found: ignore
          retention-days: 7
