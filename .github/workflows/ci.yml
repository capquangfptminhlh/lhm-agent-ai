name: LHM Agent OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (no production credentials)
        env:
          LHM_DB_PATH: ${{ runner.temp }}/lhm-agent-os-test.sqlite3
        run: python -m unittest discover -s tests -v
      - name: Validate Three.js office ES module syntax
        run: node --input-type=module --check < static/office3d.js
      - name: Build production-like local Docker image
        run: docker build --tag lhm-agent-ai:ci .
      - name: Smoke-test Docker application and Workflow Builder
        run: |
          docker run --rm -e LHM_DB_PATH=/data/ci.sqlite3 -e LHM_ADMIN_TOKEN= lhm-agent-ai:ci python -c "from app import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/health').status_code==200; assert c.get('/workflow-builder').status_code==200; assert c.get('/office3d').status_code==200; assert c.get('/api/office3d/snapshot').status_code==200; assert c.get('/tools/catalog').status_code==200; print('Docker smoke OK')"


  browser-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server and browser automation
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright>=1.50,<2'
      - name: Run real Chrome WebGL smoke (no AI credentials)
        env:
          CI: 'true'
        run: python scripts/smoke_office3d.py
      - name: Upload office screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office3d-chrome-screenshot
          path: office3d-browser-smoke.png
          if-no-files-found: ignore
          retention-days: 7
