name: LHM Agent OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (no production credentials)
        env:
          LHM_DB_PATH: ${{ runner.temp }}/lhm-agent-os-test.sqlite3
        run: python -m unittest discover -s tests -v
      - name: Build production-like local Docker image
        run: docker build --tag lhm-agent-ai:ci .
      - name: Smoke-test Docker application and Workflow Builder
        run: |
          docker run --rm -e LHM_DB_PATH=/data/ci.sqlite3 -e LHM_ADMIN_TOKEN= lhm-agent-ai:ci python -c "from app import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/health').status_code==200; assert c.get('/workflow-builder').status_code==200; assert c.get('/tools/catalog').status_code==200; print('Docker smoke OK')"

