name: LHM Agent OS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests (no production credentials)
        env:
          LHM_DB_PATH: ${{ runner.temp }}/lhm-agent-os-test.sqlite3
        run: python -m unittest discover -s tests -v
      - name: Validate Three.js office ES module syntax
        run: node --input-type=module --check < static/office3d.js
      - name: Build production-like local Docker image
        run: docker build --tag lhm-agent-ai:ci .
      - name: Smoke-test Docker application and Workflow Builder
        run: |
          docker run --rm -e LHM_DB_PATH=/data/ci.sqlite3 -e LHM_ADMIN_TOKEN= lhm-agent-ai:ci python -c "from app import app; from fastapi.testclient import TestClient; c=TestClient(app); assert c.get('/health').status_code==200; assert c.get('/workflow-builder').status_code==200; assert c.get('/office3d').status_code==200; assert c.get('/api/office3d/snapshot').status_code==200; assert c.get('/tools/catalog').status_code==200; assert c.get('/agent-tools').status_code==200; assert c.get('/tools/specialists/readiness').status_code==200; assert c.get('/computer').status_code==200; assert c.get('/workspaces/demo/computer/runs').status_code==200; assert c.get('/team-chat').status_code==200; assert c.get('/agent-work').status_code==200; assert len(c.get('/agents/fixed-jobs').json()['agents'])==16; assert c.get('/agents/departments/ui').status_code==200; assert c.get('/agents/departments').json()['count']==16; assert c.get('/workspaces/demo/team/sessions').status_code==200; print('Docker smoke OK')"


  browser-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server and browser automation
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright>=1.50,<2'
      - name: Run real Chrome WebGL smoke (no AI credentials)
        env:
          CI: 'true'
        run: python scripts/smoke_office3d.py
      - name: Smoke-test Agent Computer with REAL Chrome/Playwright
        run: python -m scripts.smoke_computer_browser
      - name: Smoke-test real Team Chat in headless Chrome
        run: python scripts/smoke_team_chat.py
      - name: Upload Team Chat screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-chat-chrome-screenshot
          path: team-chat-browser-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload office screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office3d-chrome-screenshot
          path: office3d-browser-smoke.png
          if-no-files-found: ignore
          retention-days: 7

  computer-sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose sandbox and verify runner does not receive main credentials
        run: |
          cp .env.example .env
          LHM_COMPUTER_RUNNER_TOKEN=ci-example-token docker compose --profile computer config --quiet
          LHM_COMPUTER_RUNNER_TOKEN=ci-example-token docker compose --profile computer config --format json > compose-resolved.json
          python -c "import json; d=json.load(open('compose-resolved.json')); e=d['services']['computer'].get('environment',{}); assert 'OPENROUTER_API_KEY' not in e and 'DEEPSEEK_API_KEY' not in e and 'LHM_POSTIZ_API_KEY' not in e and 'env_file' not in d['services']['computer']; print('Sidecar env isolation PASS')"
      - name: Build Playwright Computer Runner image
        run: docker build --file Dockerfile.computer --tag lhm-computer:ci .
      - name: Authenticate runner and execute sandbox file tool
        run: |
          docker run --rm --network none \
            -e LHM_COMPUTER_RUNNER_TOKEN=test-only-ci-token \
            -e LHM_COMPUTER_HOME=/tmp/agent-data \
            lhm-computer:ci python -c "from fastapi.testclient import TestClient; from computer_executor import runner; t=TestClient(runner); auth={'Authorization':'Bearer test-only-ci-token'}; assert t.get('/health',headers=auth).status_code==200; j={'workspace_id':'demo','role':'research','tool':'write_file','args':{'path':'ci-smoke.txt','content':'Computer sandbox PASS'}}; assert t.post('/v1/tool',headers=auth,json=j).status_code==200; j['tool']='read_file'; j['args']={'path':'ci-smoke.txt'}; assert t.post('/v1/tool',headers=auth,json=j).json()['content']=='Computer sandbox PASS'; print('Computer sidecar Docker smoke OK')"
