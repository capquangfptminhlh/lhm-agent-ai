# Local-first deployment. Public SaaS requires tenant auth, Vault, RBAC and isolation.
x-lhm-common: &lhm-common
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    LHM_DB_PATH: /data/lhm.sqlite3
  volumes:
    - lhm_data:/data
services:
  api:
    <<: *lhm-common
    ports:
      - "127.0.0.1:7770:7770"
  worker:
    <<: *lhm-common
    command: ["python", "worker.py"]
  computer:
    profiles: ["computer"]
    build:
      context: .
      dockerfile: Dockerfile.computer
    restart: unless-stopped
    env_file: .env
    environment:
      LHM_COMPUTER_HOME: /agent-data
    volumes:
      - lhm_computer_data:/agent-data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    shm_size: "256mb"
    # Intentionally no host port: API/worker only via internal Compose DNS.
    expose: ["7781"]
volumes:
  lhm_data:
  lhm_computer_data:
